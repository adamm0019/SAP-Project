{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4>
                    Message by
                    <a href="{{ url_for('main.user_profile', username=message.author.username) }}">
                        {{ message.author.username }}
                    </a>
                    <small class="text-muted">
                        {{ message.timestamp.strftime('%Y-%m-%d %H:%M') }}
                    </small>
                </h4>
            </div>
            <div class="card-body">
                <p class="card-text">{{ message.body | safe }}</p>
                {% if current_user == message.author %}
                <div class="mt-3">
                    <a href="{{ url_for('main.edit_message', id=message.id) }}" class="btn btn-outline-secondary">Edit</a>
                    <form action="{{ url_for('main.delete_message', id=message.id) }}" method="post" class="d-inline">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        <button type="submit" class="btn btn-outline-danger" onclick="return confirm('Are you sure?');">Delete</button>
                    </form>
                </div>
                {% endif %}
            </div>
            <div class="card-footer">
                <a href="{{ url_for('main.index') }}" class="btn btn-primary">Back to Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
